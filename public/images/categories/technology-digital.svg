<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ede9fe"/>
      <stop offset="100%" style="stop-color:#ddd6fe"/>
    </linearGradient>
    <linearGradient id="laptop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="40"/>
  
  <!-- Laptop base -->
  <rect x="100" y="200" width="200" height="15" fill="#475569" rx="6"/>
  
  <!-- Laptop screen -->
  <rect x="120" y="100" width="160" height="120" fill="url(#laptop)" rx="10"/>
  <rect x="130" y="110" width="140" height="100" fill="url(#screen)" rx="6"/>
  
  <!-- Screen content lines -->
  <rect x="145" y="130" width="60" height="6" fill="#4f46e5" rx="3"/>
  <rect x="145" y="150" width="80" height="6" fill="#4f46e5" rx="3"/>
  <rect x="145" y="170" width="50" height="6" fill="#4f46e5" rx="3"/>
  <circle cx="250" cy="170" r="15" fill="#fbbf24" opacity="0.8"/>
  
  <!-- Phone -->
  <rect x="300" y="180" width="50" height="90" fill="url(#phone)" rx="10"/>
  <rect x="305" y="190" width="40" height="70" fill="#a5b4fc" rx="6"/>
  
  <!-- Cloud -->
  <ellipse cx="100" cy="140" rx="40" ry="25" fill="#c4b5fd"/>
  <ellipse cx="130" cy="130" rx="30" ry="20" fill="#c4b5fd"/>
  <ellipse cx="85" cy="130" rx="25" ry="18" fill="#c4b5fd"/>
  
  <!-- Decorative dots -->
  <circle cx="60" cy="80" r="6" fill="#6366f1" opacity="0.3"/>
  <circle cx="340" cy="60" r="8" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="70" cy="300" r="5" fill="#fbbf24" opacity="0.3"/>
</svg>