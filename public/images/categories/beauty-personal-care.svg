<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3"/>
      <stop offset="100%" style="stop-color:#fbcfe8"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a8d4"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <linearGradient id="brush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="lipstick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="40"/>
  
  <!-- Mirror -->
  <ellipse cx="200" cy="180" rx="80" ry="100" fill="url(#mirror)"/>
  <ellipse cx="200" cy="180" rx="60" ry="80" fill="#fce7f3"/>
  
  <!-- Mirror handle -->
  <rect x="190" y="270" width="20" height="50" fill="url(#mirror)" rx="4"/>
  <circle cx="200" cy="320" r="15" fill="url(#mirror)"/>
  
  <!-- Makeup brush -->
  <rect x="80" y="140" width="15" height="100" fill="url(#brush)" rx="4"/>
  <ellipse cx="87" cy="135" rx="20" ry="25" fill="url(#brush)"/>
  
  <!-- Lipstick -->
  <rect x="300" y="160" width="25" height="80" fill="url(#lipstick)" rx="4"/>
  <path d="M305 160 L320 160 L315 140 L310 140 Z" fill="#fbbf24"/>
  
  <!-- Sparkles -->
  <path d="M120 100 L125 115 L140 120 L125 125 L120 140 L115 125 L100 120 L115 115 Z" fill="#fbbf24"/>
  <path d="M280 100 L284 110 L294 114 L284 118 L280 128 L276 118 L266 114 L276 110 Z" fill="#f472b6"/>
  <path d="M150 280 L154 290 L164 294 L154 298 L150 308 L146 298 L136 294 L146 290 Z" fill="#ec4899"/>
  
  <!-- Decorative circles -->
  <circle cx="70" cy="80" r="6" fill="#ec4899" opacity="0.3"/>
  <circle cx="340" cy="70" r="8" fill="#f472b6" opacity="0.2"/>
</svg>