<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="house" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="tool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="40"/>
  
  <!-- House body -->
  <rect x="130" y="160" width="140" height="120" fill="url(#house)" rx="12"/>
  
  <!-- Roof -->
  <polygon points="200,80 110,160 290,160" fill="url(#roof)"/>
  
  <!-- Door -->
  <rect x="175" y="220" width="50" height="60" fill="#78350f" rx="6"/>
  <circle cx="215" cy="250" r="4" fill="#fbbf24"/>
  
  <!-- Windows -->
  <rect x="145" y="180" width="35" height="35" fill="#bfdbfe" rx="4"/>
  <rect x="220" y="180" width="35" height="35" fill="#bfdbfe" rx="4"/>
  
  <!-- Chimney -->
  <rect x="240" y="100" width="25" height="40" fill="#ef4444" rx="2"/>
  
  <!-- Hammer -->
  <rect x="70" y="280" width="80" height="12" fill="url(#tool)" rx="6"/>
  <rect x="60" y="270" width="20" height="30" fill="url(#tool)" rx="4"/>
  
  <!-- Wrench -->
  <ellipse cx="320" cy="290" rx="15" ry="20" fill="url(#tool)"/>
  <rect x="315" y="300" width="10" height="50" fill="url(#tool)" rx="5"/>
  
  <!-- Decorative dots -->
  <circle cx="80" cy="120" r="6" fill="#fbbf24" opacity="0.4"/>
  <circle cx="320" cy="100" r="8" fill="#ef4444" opacity="0.3"/>
  <circle cx="50" cy="200" r="5" fill="#3b82f6" opacity="0.3"/>
</svg>